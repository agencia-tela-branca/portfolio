services:
  site-principal-atb-frontend:
    image: agenciatelabranca/site-principal-atb-frontend:latest
    container_name: site-principal-atb-frontend
    ports:
      - "3001:80"
    environment:
      - TZ=America/Sao_Paulo
    networks:
      infra_network:
        aliases:
          - site-principal-frontend
          - frontend
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  site-principal-atb-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: site-principal-atb-tunnel
    profiles:
      - tunnel
    environment:
      - TZ=America/Sao_Paulo
      - TUNNEL_TOKEN=${CLOUDFLARE_SITE_TOKEN:-${TUNNEL_TOKEN:-${CLOUDFLARE_PORTFOLIO_TOKEN:-}}}
    command: tunnel --no-autoupdate run
    networks:
      infra_network:
        aliases:
          - site-principal-tunnel
          - tunnel
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  infra_network:
    external: true
    name: infra_default
